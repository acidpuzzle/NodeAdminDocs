name: Auto Translate Documentation

on:
  push:
    branches:
      - master  # Изменено на master, так как это ваша ветка по умолчанию
    paths:
      - '**.rst'  # Скрипт сработает только тогда, когда вы измените текст документации

permissions:
  contents: write  # Дает право GitHub-боту пушить автопереводы обратно в ваш репозиторий

jobs:
  translate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install sphinx sphinx-intl polib deep-translator

      - name: Extract text and update PO files
        run: |
          # Собираем новые русские строки из .rst в шаблоны .pot
          sphinx-build -b gettext source build/gettext
          # Обновляем файлы перевода для английского языка
          sphinx-intl update -p build/gettext -l en

      - name: Run Python Auto-Translation Script
        shell: python
        run: |
          import os
          import polib
          from deep_translator import GoogleTranslator

          # Настройка перевода с русского (ru) на английский (en)
          translator = GoogleTranslator(source='ru', target='en')
          po_dir = 'locale/en/LC_MESSAGES'

          if not os.path.exists(po_dir):
              print(f"Папка {po_dir} не найдена. Пропускаем.")
              exit(0)

          for root, dirs, files in os.walk(po_dir):
              for file in files:
                  if file.endswith('.po'):
                      po_path = os.path.join(root, file)
                      po = polib.pofile(po_path)
                      has_changes = False
                      
                      print(f"Проверяем файл: {file}")
                      for entry in po:
                          # Переводим только пустые строки или строки с пометкой fuzzy (требующие проверки)
                          if not entry.msgstr or 'fuzzy' in entry.flags:
                              if entry.msgid.strip():
                                  try:
                                      # Переводим текст
                                      translated = translator.translate(entry.msgid)
                                      entry.msgstr = translated
                                      if 'fuzzy' in entry.flags:
                                          entry.flags.remove('fuzzy')
                                      has_changes = True
                                      print(f"  -> Переведено: '{entry.msgid[:30]}...' -> '{translated[:30]}...'")
                                  except Exception as e:
                                      print(f"  Ошибка перевода строки '{entry.msgid[:20]}': {e}")
                      
                      if has_changes:
                          po.save()
                          print(f"Файл {file} успешно обновлен.")

      - name: Commit and Push automatic translations
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: автоматический перевод документации [skip ci]"
          file_pattern: 'locale/**'
